spring:
  application:
    name: backend
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true

# 모니터링 (infra/observability 참고)
#   메트릭: 관리 포트의 /actuator/prometheus 를 Alloy가 가져감
#   트레이스: OTLP로 Alloy에 보냄. 스택이 있을 때만 OTLP_TRACING_ENABLED=true
#   로그: LOG_FILE을 주면 JSON으로 파일에 남기고 Alloy가 읽음. traceId/spanId 포함
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      otlp:
        enabled: ${OTLP_TRACING_ENABLED:false}
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      deployment.environment: ${APP_ENV:local}
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  file:
    name: ${LOG_FILE:}
  structured:
    format:
      file: logstash

# API 문서: /swagger-ui.html, /v3/api-docs. 운영에서 숨기려면 API_DOCS_ENABLED=false
springdoc:
  default-produces-media-type: application/json
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
