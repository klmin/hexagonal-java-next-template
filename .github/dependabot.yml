version: 2
updates:
  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
    groups:
      spring:
        patterns: ['org.springframework*']
      others:
        patterns: ['*']
        exclude-patterns: ['org.springframework*']

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      next-react:
        patterns: ['next', 'eslint-config-next', 'react', 'react-dom', '@types/react*']
      others:
        patterns: ['*']
        exclude-patterns: ['next', 'eslint-config-next', 'react', 'react-dom', '@types/react*']
    ignore:
      # openapi-typescript(7.x)가 peer로 typescript ^5만 받아서 7로 올리면 npm ci가 실패한다.
      # openapi-typescript가 7을 지원하면 지운다.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Dockerfile, compose 이미지 태그 (postgres, eclipse-temurin, node, 모니터링 스택)
  - package-ecosystem: docker
    directories: ['/backend', '/frontend']
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directories: ['/', '/backend', '/infra/observability']
    schedule:
      interval: weekly
    groups:
      observability:
        patterns: ['grafana/*', 'prom/*']
