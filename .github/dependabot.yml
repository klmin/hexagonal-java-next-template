version: 2
updates:
  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
    groups:
      spring:
        patterns: ['org.springframework*']
      others:
        patterns: ['*']
        exclude-patterns: ['org.springframework*']

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      next-react:
        patterns: ['next', 'eslint-config-next', 'react', 'react-dom', '@types/react*']
      others:
        patterns: ['*']
        exclude-patterns: ['next', 'eslint-config-next', 'react', 'react-dom', '@types/react*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
