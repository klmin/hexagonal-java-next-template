name: infra

# compose 파일(전체 스택, 로컬 DB, 모니터링 스택) 문법과 참조하는 설정 파일이 맞는지 확인한다
on:
  push:
    branches: [main]
    paths:
      - 'compose.yaml'
      - 'backend/compose.yaml'
      - 'infra/**'
      - '.github/workflows/infra.yml'
  pull_request:
    paths:
      - 'compose.yaml'
      - 'backend/compose.yaml'
      - 'infra/**'
      - '.github/workflows/infra.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: compose 설정 확인
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f backend/compose.yaml config --quiet
          cp infra/observability/.env.example infra/observability/.env
          docker compose -f infra/observability/compose.yaml config --quiet

      # 컨테이너가 떴는지만 보면 설정 오류로 바로 죽고 재시작하는 경우를 놓친다.
      # 각 서비스의 준비 상태 API가 응답하고, 그동안 재시작이 없었는지 본다
      - name: 모니터링 스택 설정 파일 확인
        working-directory: infra/observability
        run: |
          docker compose up -d --wait --wait-timeout 180
          ready() {
            for i in $(seq 1 60); do
              if curl -fsS -o /dev/null "$2"; then echo "$1 ready"; return 0; fi
              sleep 2
            done
            echo "$1 가 준비되지 않았습니다: $2"
            return 1
          }
          ready prometheus http://localhost:9090/-/ready
          ready loki http://localhost:3100/ready
          ready tempo http://localhost:3200/ready
          ready alloy http://localhost:12345/-/ready
          ready grafana http://localhost:3300/api/health
          # 준비된 뒤에도 잠시 두고 재시작이 없는지 확인
          sleep 15
          docker compose ps
          restarted=$(docker compose ps -q | xargs docker inspect -f '{{.Name}} {{.RestartCount}}' | awk '$2 > 0')
          if [ -n "$restarted" ]; then
            echo "재시작한 컨테이너가 있습니다:"
            echo "$restarted"
            exit 1
          fi

      # 앱과 같은 경로로 트레이스를 보내서(OTLP HTTP -> Alloy -> Tempo) 실제로 저장되고 조회되는지,
      # Tempo metrics-generator 가 만든 span 메트릭이 Prometheus 에 들어오는지 본다
      - name: 트레이스 송신, 조회 확인
        run: |
          trace_id=$(openssl rand -hex 16)
          span_id=$(openssl rand -hex 8)
          now=$(date +%s%N)
          cat > /tmp/trace.json <<EOF
          {"resourceSpans":[{"resource":{"attributes":[{"key":"service.name","value":{"stringValue":"infra-ci"}}]},
            "scopeSpans":[{"spans":[{"traceId":"$trace_id","spanId":"$span_id","name":"GET /ci","kind":2,
              "startTimeUnixNano":"$((now - 50000000))","endTimeUnixNano":"$now"}]}]}]}
          EOF
          curl -fsS -X POST -H 'Content-Type: application/json' --data @/tmp/trace.json http://localhost:4318/v1/traces
          echo "trace_id=$trace_id"

          for i in $(seq 1 30); do
            # 응답의 spanId 는 base64 라서 span 이름으로 확인한다. trace_id 로 조회하므로 이번 실행의 트레이스다
            if curl -fsS "http://localhost:3200/api/v2/traces/$trace_id" | grep -q '"GET /ci"'; then
              echo "Tempo 에서 조회됨"
              found=1
              break
            fi
            sleep 2
          done
          [ -n "${found:-}" ] || { echo "Tempo 에서 트레이스를 찾지 못했습니다"; exit 1; }

          for i in $(seq 1 45); do
            if curl -fsS 'http://localhost:9090/api/v1/query' --data-urlencode 'query=traces_spanmetrics_calls_total{service="infra-ci"}' | grep -q '"value"'; then
              echo "span 메트릭이 Prometheus 에 들어옴"
              exit 0
            fi
            sleep 2
          done
          echo "span 메트릭이 Prometheus 에 들어오지 않았습니다"
          exit 1

      - name: 모니터링 스택 로그 (실패 시)
        if: failure()
        working-directory: infra/observability
        run: docker compose logs --no-color

      - name: 정리
        if: always()
        working-directory: infra/observability
        run: docker compose down -v
