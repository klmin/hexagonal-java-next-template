# Tempo 단일 실행. 저장은 도커 볼륨(tempo-data)
# S3로 옮기려면 storage.trace.backend를 s3로 바꾼다.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: info

# Alloy 가 OTLP 로 보내는 트레이스 수신
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 336h   # 14일

# 트레이스로 만든 메트릭(서비스 그래프, 구간별 요청 수/지연) → Prometheus
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics, local-blocks]
